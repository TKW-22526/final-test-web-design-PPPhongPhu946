<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tất Cả Sản Phẩm - Kicks</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <div class="logo">
                <a href="../index.html">KICKS<span>.</span></a>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="../index.html">Trang Chủ</a></li>
                    <li><a href="san-pham.html" class="active">Sản Phẩm</a></li>
                    <li><a href="gioi-thieu.html">Về Chúng Tôi</a></li>
                    <li><a href="lien-he.html">Liên Hệ</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="action-btn" aria-label="Tìm kiếm"><i class="fa-solid fa-magnifying-glass"></i></button>
                <a href="auth.html" class="action-btn user-btn" aria-label="Tài khoản"><i class="fa-solid fa-user"></i><span class="user-name-display" style="display:none; font-size:14px; margin-left:5px;"></span></a>
                <a href="gio-hang.html" class="action-btn" aria-label="Giỏ hàng"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count" style="display:none;">0</span></a>
                <button class="action-btn menu-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <div class="container" style="padding-top: 120px;">
        <h1 class="section-title">Tất Cả Sản Phẩm</h1>
    </div>

    <!-- Products Section (Standalone) -->
    <section class="products section" style="padding-top: 20px;">
        <div class="container">
            <div class="section-header">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">Tất cả</button>
                    <button class="filter-btn" data-filter="running">Chạy bộ</button>
                    <button class="filter-btn" data-filter="lifestyle">Thời trang</button>
                    <button class="filter-btn" data-filter="basketball">Bóng rổ</button>
                </div>
            </div>

            <div class="product-grid" id="product-grid-container">
                <!-- Products will be dynamically loaded here by js/products.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Kicks. All rights reserved. Thiết kế bởi PPPhongPhu946.</p>
            </div>
        </div>
    </footer>

    <script src="../js/products.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/cart.js"></script>

</html>
