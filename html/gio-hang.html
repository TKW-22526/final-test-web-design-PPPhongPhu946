<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Kicks</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/gio-hang.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container header-inner">
            <div class="logo">
                <a href="../index.html">KICKS<span>.</span></a>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="../index.html">Trang Chủ</a></li>
                    <li><a href="san-pham.html">Sản Phẩm</a></li>
                    <li><a href="gioi-thieu.html">Về Chúng Tôi</a></li>
                    <li><a href="lien-he.html">Liên Hệ</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="action-btn" aria-label="Tìm kiếm"><i class="fa-solid fa-magnifying-glass"></i></button>
                <a href="auth.html" class="action-btn user-btn" aria-label="Tài khoản"><i class="fa-solid fa-user"></i><span class="user-name-display" style="display:none; font-size:14px; margin-left:5px;"></span></a>
                <a href="gio-hang.html" class="action-btn active" aria-label="Giỏ hàng"><i class="fa-solid fa-bag-shopping"></i><span class="cart-count" style="display:none;">0</span></a>
                <button class="action-btn menu-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>
    </header>

    <div class="container" style="padding-top: 120px; padding-bottom: 40px;">
        <h1 class="section-title">Giỏ Hàng Của Bạn</h1>
    </div>

    <!-- Cart Section -->
    <section class="cart-section section" style="padding-top: 0;">
        <div class="container">
            <div class="cart-grid">
                <!-- Cart Items -->
                <div class="cart-items">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Sản phẩm</th>
                                <th>Giá</th>
                                <th>Số lượng</th>
                                <th>Tạm tính</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cart-tbody">
                            <!-- Items will be injected by JS -->
                        </tbody>
                    </table>
                    <div id="empty-cart-message" style="display: none; text-align: center; padding: 40px;">
                        <i class="fa-solid fa-cart-shopping" style="font-size: 3rem; color: #ccc; margin-bottom: 20px;"></i>
                        <p>Giỏ hàng của bạn đang trống.</p>
                        <a href="san-pham.html" class="btn btn-primary" style="margin-top: 20px;">Tiếp tục mua sắm</a>
                    </div>
                </div>

                <!-- Cart Summary -->
                <div class="cart-summary">
                    <h3>Tổng Đơn Hàng</h3>
                    <div class="summary-row">
                        <span>Tạm tính</span>
                        <span id="subtotal">0₫</span>
                    </div>
                    <div class="summary-row">
                        <span>Phí vận chuyển</span>
                        <span>Miễn phí</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>Tổng cộng</span>
                        <span id="total">0₫</span>
                    </div>
                    <button class="btn btn-primary btn-block btn-lg" style="margin-top: 20px;">Tiến Hành Thanh Toán</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Kicks. All rights reserved. Thiết kế bởi PPPhongPhu946.</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
